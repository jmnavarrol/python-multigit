# -*- coding: utf-8 -*-
# https://packaging.python.org/en/latest/guides/writing-pyproject-toml/

[project]
name = 'multigit-lib'
authors = [
    { name = 'Jesús M. Navarro', email = 'jesusmnavarrolopez@gmail.com' },
]

description = 'Minimal library PoC for packaging flow validation.'
readme = 'README.md'
requires-python = '>=3.7'
dynamic = ['version']
dependencies = [
    'GitPython',
    'PyYAML',
    'Cerberus',
]

[project.optional-dependencies]
development = [
    'hatch',
    'Sphinx',
    'sphinxcontrib-programoutput',
    'sphinx-rtd-theme',
    'twine',
]

[build-system]
requires = ['hatchling']
build-backend = 'hatchling.build'

[tool.hatch.build]
packages = ['src/multigit_lib']
sources = ['src']

[tool.hatch.version]
path = 'src/multigit_lib/__init__.py'
