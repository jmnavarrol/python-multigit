# -*- coding: utf-8 -*-
# https://packaging.python.org/en/latest/guides/writing-pyproject-toml/

[project]
name = 'multigit-lib'
authors = [
    { name = 'Jesús M. Navarro', email = 'jesusmnavarrolopez@gmail.com' },
]

description = 'Reusable per-repository Git operations for multigit.'
readme = 'README.md'
keywords = ['Python', 'git-utilities']
license = { text = 'GPL-3.0' }
dynamic = ['version']
requires-python = '>=3.7'
classifiers = [
    'Programming Language :: Python :: 3',
    'Development Status :: 4 - Beta',
    'Intended Audience :: Developers',
    'Topic :: Software Development :: Version Control',
    'License :: OSI Approved :: GNU General Public License v3 (GPLv3)',
]
dependencies = [
    'GitPython',
]

[project.urls]
Documentation = 'https://jmnavarrol.github.io/python-multigit/lib/'
Source = 'https://github.com/jmnavarrol/python-multigit'
'Bug Tracker' = 'https://github.com/jmnavarrol/python-multigit/issues'

[project.optional-dependencies]
development = [
    'hatchling',
    'Sphinx',
    'sphinx-rtd-theme',
    'twine',
]

[build-system]
requires = ['hatchling']
build-backend = 'hatchling.build'

[tool.hatch.build]
packages = ['src/multigit_lib']
sources = ['src']

[tool.hatch.version]
path = 'src/multigit_lib/__init__.py'
