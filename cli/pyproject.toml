[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "multigit"
authors = [
    { name = "Jesús M. Navarro", email = "jesusmnavarrolopez@gmail.com" },
]
dynamic = ["version"]
description = "CLI distribution for multigit repository orchestration."
readme = "README.md"
keywords = ["Python", "git-utilities"]
license = { text = "GPL-3.0" }
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Version Control",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
]
dependencies = [
    "multigit-lib>=0.0.2.dev4,<1",
    "colorama",
    "Cerberus",
    "GitPython",
    "PyYAML",
]

[project.urls]
Documentation = "https://jmnavarrol.github.io/python-multigit/"
Source = "https://github.com/jmnavarrol/python-multigit"
"Bug Tracker" = "https://github.com/jmnavarrol/python-multigit/issues"

[project.scripts]
multigit = "multigit_cli.__main__:main"

[project.optional-dependencies]
development = [
    "hatchling",
    "Sphinx",
    "twine",
]

[tool.hatch.version]
path = "src/multigit_cli/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/multigit_cli"]

[tool.hatch.build.targets.sdist]
include = [
    "src/multigit_cli",
    "README.md",
]
